<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Desk Buddy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <h1>Gravity Desk Buddy</h1>

<p>Build evidence of who you are becoming.</p>

<section>
    <h2>Buddy</h2>
    <p class="buddy-state">🙂 Buddy Placeholder</p>
</section>

<section>
    <h2>Focus Timer</h2>
    <p class="timer-display">25:00</p>
</section>

<section>
    <h2>Streak</h2>
    <p class="streak-display">Start your streak</p>
</section>

<section class="clock-navigation">
    <h2>Clock Prototype</h2>

    <div class="clock-buddy">
        Buddy
    </div>

    <button class="clock-item clock-focus">Focus</button>
    <button class="clock-item clock-journal">Journal</button>
    <button class="clock-item clock-orbits">Orbits</button>
    <button class="clock-item clock-profile">Profile</button>
</section>

<button class="start-button">
    Start Focus
</button>

<button class="pause-button">
    Pause
</button>
    </div>

<script src="app.js"></script>
</body>
</html>
